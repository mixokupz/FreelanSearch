name: 'Get issue from branch/PR'
description: 'Get task number and Node ID from branch name or PR description'
inputs:
  github-token:
    description: 'GitHub token w/ issues read rights'
    required: true
  branch-name:
    description: 'Branch name (e.g., feature/42-login)'
    required: false
    default: ''
  pr-title:
    description: 'Pull Request title'
    required: false
    default: ''
  pr-body:
    description: 'Pull Request body'
    required: false
    default: ''
outputs:
  issue-number:
    description: 'Number of current task (found or not found)'
    value: ${{ steps.python.outputs.issue-number }}
  issue-node-id:
    description: 'Node ID'
    value: ${{ steps.python.outputs.issue-node-id }}
runs:
  using: 'composite'
  steps:
    - name: Extract issue info (Python)
      id: python
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH_NAME: ${{ inputs.branch-name }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        REPOSITORY: ${{ github.repository }}       # owner/repo
      shell: bash
      run: python3 ${{ github.action_path }}/get_issue.py
