openapi: 3.0.3
info:
  title: API Биржи фрилансеров
  description: Интерактивная документация REST API для платформы взаимодействия фрилансеров и заказчиков.
  version: 1.0.0

servers:
  - url: https://api.yourfreelance.com
    description: Основной сервер

paths:

  /api/v1/auth/login:
    post:
      summary: Вход в систему (Авторизация)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: Регистрация нового пользователя
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # =========================
  # USERS / PROFILES
  # =========================

  /api/v1/users:
    get:
      summary: Каталог пользователей
      tags: [Users]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserProfileResponse'
                      total_count:
                        type: integer

  /api/v1/users/me:
    get:
      summary: Профиль текущего пользователя
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    $ref: '#/components/schemas/UserProfileResponse'

  /api/v1/users/{id}:
    get:
      summary: Профиль пользователя по ID
      tags: [Users]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    $ref: '#/components/schemas/UserProfileResponse'

  # =========================
  # NEW: PROFILES (CLEAN API)
  # =========================

  /api/v1/profiles:
    get:
      summary: Получить все публичные профили (каталог фрилансеров)
      tags: [Users]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfileResponse'

  # =========================
  # SERVICES / LISTINGS
  # =========================

  /api/v1/users/me/services:
    get:
      summary: Услуги текущего пользователя
      tags: [Services]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /api/v1/users/{id}/services:
    get:
      summary: Услуги пользователя
      tags: [Services]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  # =========================
  # NEW: LISTINGS
  # =========================

  /api/v1/listings:
    get:
      summary: Получить все объявления (каталог услуг)
      tags: [Listings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserServiceResponse'

  /api/v1/users/me/deals:
    get:
      summary: Сделки пользователя
      tags: [Deals]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /api/v1/users/me/reviews:
    get:
      summary: Отзывы пользователя
      tags: [Reviews]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /api/v1/users/{id}/reviews:
    get:
      summary: Отзывы по пользователю
      tags: [Reviews]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:

    UserProfileResponse:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { type: string }
        is_blocked: { type: boolean }
        created_at: { type: string, format: date-time }
        name: { type: string }
        avatar_url: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        city: { type: string, nullable: true }
        avg_rating: { type: number }
        reviews_count: { type: integer }

    UserServiceResponse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        execution_period_days: { type: integer }
        price: { type: number, nullable: true }
        price_type: { type: string }
        status: { type: string }

    DealResponse:
      type: object
      properties:
        id: { type: integer }

    ReviewResponse:
      type: object
      properties:
        id: { type: integer }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            userId: { type: string }
            token: { type: string }
            status: { type: string }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }