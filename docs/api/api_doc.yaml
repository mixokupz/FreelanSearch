openapi: 3.0.3
info:
  title: API Биржи фрилансеров
  description: Интерактивная документация REST API для платформы взаимодействия фрилансеров и заказчиков.
  version: 1.0.0
servers:
  - url: https://api.yourfreelance.com
    description: Основной сервер
paths:
  /api/v1/auth/login:
    post:
      summary: Вход в систему (Авторизация)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации (например, неверный формат email или пустой пароль)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неверные учетные данные (Неверный email или пароль)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: Регистрация нового пользователя
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации (слишком короткий пароль, пустое имя и т.д.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт данных (Пользователь с таким email уже существует)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me:
    get:
      summary: Получить профиль текущего пользователя
      operationId: getCurrentUserProfile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/services/me:
    get:
      summary: Получить услуги текущего пользователя
      operationId: getCurrentUserServices
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserService'

  /api/v1/deals:
    get:
      summary: Получить список сделок текущего пользователя (в параметрах указывается сделки кого отображать - фрилансера или заказчика)
      tags:
        - Deals
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, freelancer]
        - in: query
          name: status
          schema:
            type: string
            enum: [in_progress, completed, cancelled, disputed]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Deal'

  /api/v1/reviews/me:
    get:
      summary: Получить отзывы о текущем пользователе
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, freelancer]
          required: true
          description: |
            - `freelancer` - отзывы о пользователе как об исполнителе
            - `customer` - отзывы о пользователе как о заказчике
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Review'
                      summary:
                        type: object
                        properties:
                          total_count:
                            type: integer
                          avg_rating:
                            type: number

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin, moderator]
        is_blocked:
          type: boolean
        created_at:
          type: string
          format: date-time
        name:
          type: string
        avatar_url:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        avg_rating:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
        reviews_count:
          type: integer
          minimum: 0

    UserService:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
          nullable: true
        price_type:
          type: string
          enum: [fixed, negotiable, free]
        status:
          type: string
          enum: [pending, active, rejected, archived]
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            slug:
              type: string
        photos:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              url:
                type: string
              sort_order:
                type: integer
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Deal:
      type: object
      properties:
        id:
          type: integer
        client:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        executor:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        service:
          type: object
          properties:
            id:
              type: integer
              nullable: true
            title:
              type: string
        status:
          type: string
          enum: [in_progress, completed, cancelled, disputed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    Review:
      type: object
      properties:
        id:
          type: integer
        deal_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        author:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        target_role:
          type: string
          enum: [executor, client]
        created_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            userId:
              type: string
            status:
              type: string
            token:
              type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string