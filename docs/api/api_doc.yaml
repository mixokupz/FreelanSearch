openapi: 3.0.3
info:
  title: API Биржи фрилансеров
  description: Интерактивная документация REST API для платформы взаимодействия фрилансеров и заказчиков.
  version: 1.0.0
servers:
  - url: https://api.yourfreelance.com
    description: Основной сервер

paths:

  /api/v1/auth/login:
    post:
      summary: Вход в систему (Авторизация)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: Регистрация нового пользователя
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/v1/users:
    get:
      summary: Получить список пользователей (Каталог фрилансеров)
      operationId: getUsersList
      tags:
        - Users
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserProfileResponse'
                      total_count:
                        type: integer

  /api/v1/users/me:
    get:
      summary: Получить профиль текущего пользователя
      operationId: getCurrentUserProfile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/media/{mediaId}:
    get:
      summary: Скачать медиафайл (изображение) по id
      operationId: downloadMediaById
      tags:
        - Media
      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ с бинарным содержимым изображения
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Файл не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'




  /api/v1/users/me/services:
    get:
      summary: Получить список услуг текущего пользователя
      operationId: getCurrentUserServices
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserServiceResponse'

  /api/v1/users/{id}/services:
    get:
      summary: Получить список услуг конкретного пользователя (фрилансера)
      operationId: getUserServicesByUserId
      tags:
        - Services
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserServiceResponse'




  /api/v1/users/me/deals:
    get:
      summary: Получить список сделок текущего пользователя
      operationId: getCurrentUserDeals
      tags:
        - Deals
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, freelancer]
        - in: query
          name: status
          schema:
            type: string
            enum: [in_progress, completed, cancelled, disputed]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DealResponse'


  /api/v1/users/me/reviews:
    get:
      summary: Получить отзывы о текущем пользователе
      operationId: getCurrentUserReviews
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, freelancer]
          required: true
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReviewResponse'
                      summary:
                        type: object
                        properties:
                          total_count:
                            type: integer
                          avg_rating:
                            type: number

  /api/v1/users/{id}/reviews:
    get:
      summary: Получить отзывы о конкретном пользователе
      operationId: getUserReviewsById
      tags:
        - Reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, freelancer]
          required: true
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReviewResponse'
                      summary:
                        type: object
                        properties:
                          total_count:
                            type: integer
                          avg_rating:
                            type: number
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin, moderator]
        is_blocked:
          type: boolean
        created_at:
          type: string
          format: date-time
        name:
          type: string
        avatar_url:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        avg_rating:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
        reviews_count:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string

    UserServiceResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        execution_period_days:
          type: integer
        price:
          type: number
          format: decimal
          nullable: true
        price_type:
          type: string
          enum: [fixed, negotiable, free]
        status:
          type: string
          enum: [pending, active, rejected, archived]
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            slug:
              type: string
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DealResponse:
      type: object
      properties:
        id:
          type: integer
        client:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        executor:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        service:
          type: object
          properties:
            id:
              type: integer
              nullable: true
            title:
              type: string
        status:
          type: string
          enum: [in_progress, completed, cancelled, disputed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        payment:
          type: integer

    ReviewResponse:
      type: object
      properties:
        id:
          type: integer
        deal_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        author:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        target_role:
          type: string
          enum: [executor, client]
        created_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            userId:
              type: string
            status:
              type: string
            token:
              type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
