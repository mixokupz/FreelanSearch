openapi: 3.0.3
info:
  title: API Биржи фрилансеров
  description: Интерактивная документация REST API для платформы взаимодействия фрилансеров и заказчиков.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Основной сервер

paths:

  # ==========================================
  # AUTH
  # ==========================================
  /api/v1/auth/login:
    post:
      summary: Вход в систему (Авторизация)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: Регистрация нового пользователя
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # LISTINGS (New Endpoints)
  # ==========================================
  /api/v1/listings:
    post:
      summary: Создать новое объявление
      description: Создает новое объявление об услуге. Заголовок Authorization опционален, но может использоваться для привязки к пользователю.
      tags:
        - Listings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Объявление успешно создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ListingDetailsResponse'
        '400':
          description: Некорректный запрос / ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'

  /api/v1/listings/{id}:
    get:
      summary: Получить объявление по ID
      description: Возвращает полную информацию об объявлении.
      tags:
        - Listings
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Идентификатор объявления
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ListingDetailsResponse'
        '404':
          description: Объявление не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'

    put:
      summary: Обновить объявление
      description: Обновляет существующее объявление по его ID.
      tags:
        - Listings
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Идентификатор объявления
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingRequest'
      responses:
        '200':
          description: Объявление успешно обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ListingDetailsResponse'
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'
        '404':
          description: Объявление не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'

    delete:
      summary: Удалить объявление
      description: Удаляет объявление по его ID.
      tags:
        - Listings
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Идентификатор объявления
      responses:
        '200':
          description: Объявление успешно удалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Объявление успешно удалено"
        '404':
          description: Объявление не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'

  # ==========================================
  # USERS
  # ==========================================
  /api/v1/users/me:
    get:
      summary: Получить полный профиль текущего пользователя
      description: Возвращает полный профиль аутентифицированного пользователя (включая email и phone).
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/OwnProfileResponse'
        '401':
          description: Отсутствует или невалидный JWT токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'

    put:
      summary: Обновить профиль текущего пользователя
      description: Обновляет профиль аутентифицированного пользователя. Все поля опциональны — обновляются только переданные.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Профиль успешно обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/OwnProfileResponse'
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'
        '401':
          description: Отсутствует или невалидный JWT токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'

  /api/v1/users/{userId}:
    get:
      summary: Получить публичный профиль пользователя
      description: Возвращает публичный профиль пользователя (без скрытых данных, таких как email и phone).
      tags:
        - Users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PublicProfileResponse'
        '403':
          description: Пользователь заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'
  
  
  /api/v1/users/me/deals:
    get:
      summary: Получить список сделок текущего пользователя
      operationId: getCurrentUserDeals
      tags:
        - Deals
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, freelancer]
        - in: query
          name: status
          schema:
            type: string
            enum: [in_progress, completed, cancelled, disputed]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DealResponse'

  /api/v1/users/me/reviews:
    get:
      summary: Получить отзывы о текущем пользователе
      operationId: getCurrentUserReviews
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, freelancer]
          required: true
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReviewResponse'
                      summary:
                        type: object
                        properties:
                          total_count:
                            type: integer
                          avg_rating:
                            type: number

  /api/v1/users/{id}/reviews:
    get:
      summary: Получить отзывы о конкретном пользователе
      operationId: getUserReviewsById
      tags:
        - Reviews
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, freelancer]
          required: true
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReviewResponse'
                      summary:
                        type: object
                        properties:
                          total_count:
                            type: integer
                          avg_rating:
                            type: number
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
  
    # ----------------------------------------
    # LISTING SCHEMAS (New)
    # ----------------------------------------
    CreateListingRequest:
      type: object
      required:
        - title
        - description
        - price
        - priceType
      properties:
        title:
          type: string
          example: "Настройка роутера"
        description:
          type: string
          example: "Помогу настроить Wi-Fi и роутер дома."
        price:
          type: number
          format: decimal
          example: 1500.00
        priceType:
          type: string
          enum: [fixed, negotiable, free]
          example: "fixed"

    UpdateListingRequest:
      type: object
      properties:
        title:
          type: string
          example: "Настройка роутера и Wi-Fi"
        description:
          type: string
          example: "Помогу настроить роутер, Wi-Fi и сеть дома."
        price:
          type: number
          format: decimal
          example: 2000.00
        priceType:
          type: string
          enum: [fixed, negotiable, free]
          example: "fixed"
        status:
          type: string
          enum: [pending, active, rejected, archived]
          example: "active"

    ListingDetailsResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Настройка роутера"
        description:
          type: string
          example: "Помогу настроить Wi-Fi и роутер дома."
        price:
          type: number
          format: decimal
          example: 1500.00
        priceType:
          type: string
          example: "fixed"
        status:
          type: string
          example: "active"

    # ----------------------------------------
    # PROFILE SCHEMAS
    # ----------------------------------------
    OwnProfileResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
        is_blocked:
          type: boolean
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        bio:
          type: string
        city:
          type: string
        avg_rating:
          type: number
          format: double
        reviews_count:
          type: integer
        updated_at:
          type: string
          format: date-time

    PublicProfileResponse:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
        display_name:
          type: string
          format: uri
        avatar_url:
          type: string
          format: uri
        bio:
          type: string
        city:
          type: string
        avg_rating:
          type: number
          format: double
        reviews_count:
          type: integer
        updated_at:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        avatar_url:
          type: string
          format: uri
          maxLength: 500
        bio:
          type: string
        city:
          type: string
          maxLength: 100

    ProfileErrorResponse:
      type: object
      description: Специфичный формат ошибки для контроллера профилей
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          properties:
            message:
              type: string

    # ----------------------------------------
    # OTHER SCHEMAS
    # ----------------------------------------
  

    DealResponse:
      type: object
      properties:
        id:
          type: integer
        client:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        executor:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        service:
          type: object
          properties:
            id:
              type: integer
              nullable: true
            title:
              type: string
        status:
          type: string
          enum: [in_progress, completed, cancelled, disputed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        payment:
          type: integer

    ReviewResponse:
      type: object
      properties:
        id:
          type: integer
        deal_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        author:
          type: object
          properties:
            id:
              type: integer
            display_name:
              type: string
            avatar_url:
              type: string
              nullable: true
        target_role:
          type: string
          enum: [executor, client]
        created_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            userId:
              type: string
            status:
              type: string
            token:
              type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string